<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF6EB" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#8A662F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Outer Gold Ring -->
  <circle cx="50" cy="50" r="45" fill="#FAF8F5" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#shadow)" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2,2" />
  
  <!-- Monogram R & A -->
  <text x="50" y="58" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">R&amp;A</text>
  
  <!-- Small Romantic Diamond Accent -->
  <path d="M50 24 L52 27 L50 30 L48 27 Z" fill="#C5A059" />
  <path d="M50 70 L52 73 L50 76 L48 73 Z" fill="#C5A059" />
</svg>
